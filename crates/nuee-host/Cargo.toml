[package]
name = "nuee-host"
description = "TCP tunnels and HTTP over iroh for Nuée"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
nuee-proto = { workspace = true }
nuee-net = { workspace = true }
iroh = { workspace = true, features = ["tls-ring", "metrics", "portmapper", "fast-apple-datapath"] }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt", "sync"] }
hyper = { workspace = true, features = ["server", "client", "http1"] }
bytes = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true, features = ["use-std"] }

[lints]
workspace = true

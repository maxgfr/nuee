name: CI
on:
  # Not on push as well: every commit of a pull request would run the whole CI twice.
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0
  BINARYEN_VERSION: '133'
jobs:
  check:
    name: check (${{ matrix.stage }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Groups of scripts/check.sh, side by side; together they are every stage of the gate.
        stage: [static, test, e2e-1, e2e-2, e2e-3, fuzz]
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # Far below the 6-hour job limit; the e2e suite stops itself after 45 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nightly only drives `cargo +nightly fuzz`; rust-toolchain.toml keeps the pinned stable.
      # Only in the fuzz job: rust-cache hashes every installed toolchain, so a nightly that
      # changes daily would give the cache a new key, and an empty cache, every day.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: matrix.stage == 'fuzz'
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      # One cache for the lints and one for the builds, saved from main only: pull requests
      # read it, and the 10 GB of the repository are not spent on a copy per branch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.stage != 'fuzz'
        with:
          key: ${{ matrix.stage == 'static' && 'static' || 'build' }}
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.stage == 'static' || matrix.stage == 'test') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Rebuilding the manual page index after every package is most of an apt install's time.
      - name: Skip the manual page index in apt installs
        if: runner.os == 'Linux'
        run: sudo rm -f /var/lib/man-db/auto-update
      - name: Install the Vulkan software driver (lavapipe) and bubblewrap for the exec sandbox tests
        if: runner.os == 'Linux' && (matrix.stage == 'test' || startsWith(matrix.stage, 'e2e'))
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers bubblewrap
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them.
      - name: Allow unprivileged user namespaces for bwrap
        if: runner.os == 'Linux' && (matrix.stage == 'test' || startsWith(matrix.stage, 'e2e'))
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net --unshare-pid --die-with-parent true
      # ring's build script compiles C for wasm32 and Apple's clang ships no wasm32 backend.
      - name: Use Homebrew LLVM for the wasm32 C toolchain
        if: runner.os == 'macOS' && matrix.stage != 'fuzz'
        run: |
          brew install llvm
          llvm_prefix=$(brew --prefix llvm)
          "$llvm_prefix/bin/clang" --target=wasm32-unknown-unknown --print-targets | grep -q wasm32
          {
            echo "CC_wasm32_unknown_unknown=$llvm_prefix/bin/clang"
            echo "AR_wasm32_unknown_unknown=$llvm_prefix/bin/llvm-ar"
          } >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-bindgen@0.2.128,wasm-pack@0.15.0,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-fuzz@0.13.2,shellcheck@0.11.0
      # install-action has no actionlint manifest at this pin; the Go module proxy checksums it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.stage == 'static'
        with:
          go-version: stable
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        if: matrix.stage == 'static'
      - name: Install binaryen (wasm-opt)
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=x86_64-linux sum=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 ;;
            Linux-ARM64) asset=aarch64-linux sum=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8 ;;
            macOS-ARM64) asset=arm64-macos sum=ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8 ;;
            macOS-X64) asset=x86_64-macos sum=13a9b90be775c6389ce3d1f879cb8627bea56708ba8c122983941d53a8199b95 ;;
            *) echo "unsupported runner $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          # The SHA-256 sums are of binaryen version_133; change them with BINARYEN_VERSION.
          tarball="$RUNNER_TEMP/binaryen-${asset}.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-${asset}.tar.gz"
          curl -fsSL -o "$tarball" "$url"
          echo "$sum  $tarball" | shasum -a 256 -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: wasm-opt --version
      - run: npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
        if: startsWith(matrix.stage, 'e2e')
      # The browsers are kept between runs; their system libraries are installed each time.
      - id: browsers
        if: startsWith(matrix.stage, 'e2e')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx --prefix e2e playwright install --with-deps chromium firefox webkit
        if: startsWith(matrix.stage, 'e2e') && steps.browsers.outputs.cache-hit != 'true'
      - run: npx --prefix e2e playwright install-deps chromium firefox webkit
        if: startsWith(matrix.stage, 'e2e') && steps.browsers.outputs.cache-hit == 'true'
      - run: scripts/check.sh ${{ matrix.stage }}
  # The Action as a workflow really runs it, on a group that lives on this runner and needs no
  # repository secret. Only the network between the machines differs from a team's own group.
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_COMMAND: mkdir dist && git rev-parse HEAD > dist/commit.txt
      TEST_COMMAND: test {i} -le {n}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build
          save-if: false
      - run: sudo rm -f /var/lib/man-db/auto-update
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: scripts/build-tasks.sh && cargo build --locked -p nuee
      - id: group
        name: Start a group on this runner
        run: |
          nuee=$PWD/target/debug/nuee
          export NUEE_CONFIG_DIR="$RUNNER_TEMP/machine/config" NUEE_DATA_DIR="$RUNNER_TEMP/machine/data"
          link=$("$nuee" group create ci 2>/dev/null | grep '#/G/' | head -n 1)
          key=$("$nuee" group ci-key "$link" --name action 2>/dev/null | grep -E '^[0-9a-f]{64}$')
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          nohup "$nuee" group up "$link" --allow-repo "$repo" \
            --allow-command "$BUILD_COMMAND" --allow-command "$TEST_COMMAND" \
            >"$RUNNER_TEMP/machine.log" 2>&1 &
          for _ in $(seq 60); do
            if grep -q "coordinating the group" "$RUNNER_TEMP/machine.log"; then break; fi
            sleep 1
          done
          grep -q "coordinating the group" "$RUNNER_TEMP/machine.log"
          echo "link=$link" >>"$GITHUB_OUTPUT"
          echo "key=$key" >>"$GITHUB_OUTPUT"
      - id: build
        uses: ./
        env:
          NUEE_BIN: ${{ github.workspace }}/target/debug/nuee
        with:
          group: ${{ steps.group.outputs.link }}
          key: ${{ steps.group.outputs.key }}
          command: ${{ env.BUILD_COMMAND }}
          keep: dist
      - name: The build's output came back, from this commit
        run: test "$(cat "$OUT/dist/commit.txt")" = "$GITHUB_SHA"
        env:
          OUT: ${{ steps.build.outputs.out }}
      - uses: ./
        env:
          NUEE_BIN: ${{ github.workspace }}/target/debug/nuee
        with:
          group: ${{ steps.group.outputs.link }}
          key: ${{ steps.group.outputs.key }}
          command: ${{ env.TEST_COMMAND }}
          shards: '3'
          out: nuee-shards
      - if: failure()
        run: cat "$RUNNER_TEMP/machine.log"
  nan-lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    name: nan-lint (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/build-tasks.sh
      - run: cargo test --locked -p nuee-exec --test golden

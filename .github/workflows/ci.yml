name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0
  BINARYEN_VERSION: '133'
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nightly only drives `cargo +nightly fuzz`; rust-toolchain.toml keeps the pinned stable.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the Vulkan software driver (lavapipe) and bubblewrap for the exec sandbox tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers bubblewrap
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them.
      - name: Allow unprivileged user namespaces for bwrap
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net --unshare-pid --die-with-parent true
      # ring's build script compiles C for wasm32 and Apple's clang ships no wasm32 backend.
      - name: Use Homebrew LLVM for the wasm32 C toolchain
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          llvm_prefix=$(brew --prefix llvm)
          "$llvm_prefix/bin/clang" --target=wasm32-unknown-unknown --print-targets | grep -q wasm32
          {
            echo "CC_wasm32_unknown_unknown=$llvm_prefix/bin/clang"
            echo "AR_wasm32_unknown_unknown=$llvm_prefix/bin/llvm-ar"
          } >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@0.2.128,wasm-pack@0.15.0,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-fuzz@0.13.2,shellcheck@0.11.0
      # install-action has no actionlint manifest at this pin; the Go module proxy checksums it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install binaryen (wasm-opt)
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=x86_64-linux sum=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 ;;
            Linux-ARM64) asset=aarch64-linux sum=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8 ;;
            macOS-ARM64) asset=arm64-macos sum=ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8 ;;
            macOS-X64) asset=x86_64-macos sum=13a9b90be775c6389ce3d1f879cb8627bea56708ba8c122983941d53a8199b95 ;;
            *) echo "unsupported runner $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          # The SHA-256 sums are of binaryen version_133; change them with BINARYEN_VERSION.
          tarball="$RUNNER_TEMP/binaryen-${asset}.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-${asset}.tar.gz"
          curl -fsSL -o "$tarball" "$url"
          echo "$sum  $tarball" | shasum -a 256 -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: wasm-opt --version
      - run: npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
      - run: npx --prefix e2e playwright install --with-deps chromium firefox webkit
      - run: scripts/check.sh
  nan-lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    name: nan-lint (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/build-tasks.sh
      - run: cargo test --locked -p nuee-exec --test golden

[package]
name = "nuee"
description = "Share a link, get a swarm: distributed compute, files and hosting over iroh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "nuee"
path = "src/main.rs"

[features]
# Embeds target/tasks/skycmd-arena.wasm (built by scripts/build-tasks.sh) for `demo:skycmd`.
# Release builds turn it on; mandelbrot and the toy trainer are always embedded from tasks/golden.
embed-tasks = []

[dependencies]
nuee-proto = { workspace = true }
nuee-core = { workspace = true }
nuee-net = { workspace = true }
nuee-exec = { workspace = true }
nuee-gpu = { workspace = true, features = ["native"] }
nuee-store = { workspace = true }
nuee-train = { workspace = true }
nuee-host = { workspace = true }
iroh = { workspace = true, features = ["tls-ring", "metrics", "portmapper", "fast-apple-datapath"] }
iroh-relay = { workspace = true, features = ["server", "tls-ring", "metrics"] }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
indicatif = { workspace = true }
qrcode = { workspace = true, features = ["svg"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "ansi", "std"] }
tempfile = { workspace = true }
bytes = { workspace = true }
iroh-blobs = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

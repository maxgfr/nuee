[package]
name = "nuee-proto"
description = "Wire types, links, manifests and limits for the Nuée swarm protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
blake3 = { workspace = true }
iroh-base = { workspace = true, features = ["key"] }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
data-encoding = { workspace = true }
toml = { workspace = true, features = ["serde", "parse"] }
wasmparser = { workspace = true, features = ["validate", "features", "simd"] }
thiserror = { workspace = true }
getrandom04 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
wat = { workspace = true }

[lints]
workspace = true

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The RustCrypto crates share the digest traits and must move together, majors included.
      rustcrypto:
        patterns:
          - sha2
          - sha1
          - sha3
          - hmac
          - hkdf
          - digest
          - crypto-common
          - block-buffer
          - cipher
          - aead
          - signature
          - universal-hash
        update-types: [major, minor, patch]
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The RustCrypto crates share the digest traits and must move together, majors included.
      rustcrypto:
        patterns:
          - sha2
          - sha1
          - sha3
          - hmac
          - hkdf
          - digest
          - crypto-common
          - block-buffer
          - cipher
          - aead
          - signature
          - universal-hash
        update-types: [major, minor, patch]
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 10.x only renders with conventional-changelog-writer 9, and the latest
      # @semantic-release/release-notes-generator (14.1.1) still ships writer 8.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # WebKit 27.2 (Playwright 1.64) applies the page's style-src-attr 'none' to the inline
      # style of <select>'s own shadow tree, so every page with a <select> logs a CSP violation.
      - dependency-name: '@playwright/test'
        versions: ['1.64.x']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

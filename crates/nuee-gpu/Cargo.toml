[package]
name = "nuee-gpu"
description = "GPU, embedding and LLM tasks for Nuée, with tolerance verifiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[features]
default = ["native"]
native = [
    "dep:wgpu",
    "dep:naga",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:safetensors",
    "dep:sha2",
    "dep:objc2",
]

[dependencies]
nuee-proto = { workspace = true }
nuee-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true, optional = true }
naga = { workspace = true, optional = true, features = ["wgsl-in"] }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true, features = ["fancy-regex"] }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "json", "http2", "stream"] }
rustls = { workspace = true, optional = true, features = ["ring", "std"] }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "time", "sync"] }
safetensors = { workspace = true, optional = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, optional = true, features = ["metal"] }
objc2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
